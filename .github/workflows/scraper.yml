name: North India College Scraper

# This allows you to run it manually from the GitHub website
on:
  workflow_dispatch:
  # Uncomment the next two lines to make it run automatically every night at midnight UTC
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up installation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Scraper Pipeline
        run: |
          # Running the pipeline. We don't use systemd here because GitHub manages the execution.
          python run_pipeline.py --final-output final_north_india_deep_contacts.xlsx

      - name: Upload Excel file as Artifact
        uses: actions/upload-artifact@v4
        # This step runs even if the scraper fails halfway, so you can see partial results
        if: always() 
        with:
          name: scraper-results
          path: final_north_india_deep_contacts.xlsx
          retention-days: 7
          
      - name: Upload Checkpoint File (Optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-checkpoint
          path: scraper_checkpoint.json
          retention-days: 7